name: 'Run Tests'
description: 'Run Tests for KidProblem'

runs:
  using: "composite"
  steps:

  - name: Build solution
    run: dotnet build --configuration Release 
    working-directory: ./kid-problem-ui-test-selenium

  - name: Run xUnit Tests
    run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=test_results.trx"
    working-directory: ./kid-problem-ui-test-selenium
    env:
      # BASE_URL: ${{ vars.BASE_URL }}
      KPUITEST_ADMIN_USERNAME: ${{ secrets.TEST_USER_USERNAME }}
      KPUITEST_ADMIN_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      KPUITEST_CHILD_USERNAME: ${{ secrets.TEST_CHILD_USERNAME }}
      KPUITEST_CHILD_PASSWORD: ${{ secrets.TEST_CHILD_PASSWORD }}

  - name: Upload Test Results
    uses: actions/upload-artifact@v4
    if: failure()
    with:
      name: xunit-test-results
      path: |
        'kid-problem-ui-test-selenium/KpUiTestxUnit/**/test_results.trx'
        'kid-problem-ui-test-selenium/KpUiTestxUnit/**/Screenshots/*.png'
      retention-days: 30