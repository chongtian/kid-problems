name: 'Build and Deploy Steps'
description: 'Shared build and deployment logic for KidProblem'
inputs:
  deploy:
    description: 'Deploy to AWS'
    required: true
    default: 'false'
  production:
    description: 'Is production environment'
    required: true
    default: 'false'
  runTest:
    description: 'Run Angular tests'
    required: true
    default: 'false'
  lambdaFunctionName:
    description: 'AWS Lambda Name'
    required: false
    default: 'kidproblemdev'
  s3BucketName:
    description: 'AWS S3 Bucket Name'
    required: false
    default: 'kidproblemdev.nowsuncorp.com'

runs:
  using: "composite"
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.x' 

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Update Environment Variable (Staging Only)
      if: inputs.deploy == 'true' && inputs.production == 'false'
      shell: bash
      run: |
        TARGETDIR="${{ github.workspace }}/KidproblemService/KidproblemService/aws-lambda-tools-defaults.json"
        sed -i "s/ASPNETCORE_ENVIRONMENT=Production/ASPNETCORE_ENVIRONMENT=Development/g" "$TARGETDIR"

    - name: Modify Build Number
      shell: bash
      run: |
        BUILDNUM="$(date +'%y%m%d').${{ github.run_number }}"
        CLIENT_VER_PROD="${{ github.workspace }}/kidproblem-client/src/environments/environment.prod.ts"
        CLIENT_VER_DEV="${{ github.workspace }}/kidproblem-client/src/environments/environment.development.ts"
        SERVICE_VER_PROD="${{ github.workspace }}/KidproblemService/KidproblemService/appsettings.json"
        SERVICE_VER_DEV="${{ github.workspace }}/KidproblemService/KidproblemService/appsettings.Development.json"
        sed -i "s/#BuildNumber#/${BUILDNUM}/g" "$CLIENT_VER_PROD"
        sed -i "s/#BuildNumber#/${BUILDNUM}/g" "$CLIENT_VER_DEV"
        sed -i "s/__SERVICE_VERSION__/${BUILDNUM}/g" "$SERVICE_VER_PROD"
        sed -i "s/__SERVICE_VERSION__/${BUILDNUM}/g" "$SERVICE_VER_DEV"
        echo "Build number set to: $BUILDNUM"

    - name: Install Lambda Tools
      if: inputs.deploy == 'true'
      shell: bash
      run: dotnet tool install -g Amazon.Lambda.Tools

    - name: Deploy Lambda
      if: inputs.deploy == 'true'
      working-directory: ./KidproblemService/KidproblemService
      shell: bash
      run: |
        dotnet lambda deploy-function "${{ inputs.lambdaFunctionName }}" \
          --region us-east-2 \
          --function-role inforcentralrole \
          --function-memory-size 256 \
          --function-timeout 30

    - name: Publish .NET (If not deploying)
      if: inputs.deploy != 'true'
      shell: bash
      run: |
        dotnet publish ./KidproblemService/KidproblemService/KidproblemService.csproj -c Release -o ./publish
        cd ./publish && zip -r ../Services.zip .

    - name: Install Angular Dependencies
      shell: bash
      working-directory: ./kidproblem-client
      run: npm ci

    - name: Build Angular UI
      shell: bash
      working-directory: ./kidproblem-client
      run: |
        if [ "${{ inputs.production }}" == "true" ]; then
          npm run build:prod
        else
          npm run build:dev
        fi

    - name: Upload Angular to S3
      if: inputs.deploy == 'true'
      shell: bash
      run: |
        aws s3 sync ./kidproblem-client/dist/browser s3://${{ inputs.s3BucketName }} --region us-east-2
      continue-on-error: true

    # - name: Run Tests
    #   if: inputs.runTest == 'true'
    #   shell: bash
    #   working-directory: ./kidproblem-client
    #   run: npm run devops-test

    - name: Upload Artifacts
      if: inputs.production == 'false'
      uses: actions/upload-artifact@v4
      with:
        name: ReleaseFiles
        path: |
          ./Services.zip
          ./kidproblem-client/dist/browser