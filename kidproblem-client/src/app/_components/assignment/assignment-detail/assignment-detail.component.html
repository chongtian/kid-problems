<app-assignment-detail-view [entity-id]="assignmentId$" [edit]="isEdit$" (changed)="onChanged($event)"
(deleted)="onDeleted($event)"></app-assignment-detail-view>

<mat-divider></mat-divider>

<mat-card>
  <mat-card-actions>
    @if (!isEdit$.value && canEdit) {
      <button mat-raised-button color="primary" (click)="switchView()" data-testid="switchView"
        matTooltip="Enable Edit">
        <i class="material-icons"> edit </i></button>
      }
      @if (isEdit$.value) {
        <button mat-raised-button color="primary" (click)="switchView()" data-testid="switchView"
          matTooltip="Back to View-only">
          <i class="material-icons"> arrow_back </i></button>
        }
      </mat-card-actions>
    </mat-card>
