@if (messageService.messages.length) {
  <div class="w3-panel w3-pale-red w3-leftbar w3-border-red">
    Messages <br />
    <ul class="w3-ul w3-small" data-testid="messages">
      @for (message of messageService.messages; track message) {
        <li> {{message}}</li>
      }
    </ul>
    <button mat-mini-fab (click)="messageService.clear()" data-testid="btnClearMessages"><i class="material-icons">clear</i></button>
  </div>
}
